databases:
  - name: agrawal-store-db
    plan: free
    databaseName: agrawal_store
    user: agrawal_store_user

services:
  - type: web
    name: agrawal-sanitary-electricals
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agrawal-store-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://agrawal-sanitary-electricals.onrender.com
      - key: ADMIN_EMAIL
        value: admin@agrawalsanitary.in
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: WHATSAPP_PHONE_NUMBER
        sync: false
      - key: META_WA_TOKEN
        sync: false
      - key: META_WA_PHONE_NUMBER_ID
        sync: false
      - key: META_WA_TEMPLATE_NAME
        value: order_received
      - key: META_WA_TEMPLATE_LANGUAGE
        value: en
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
